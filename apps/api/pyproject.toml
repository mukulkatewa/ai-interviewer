[project]
name = "api"
version = "0.1.0"
description = "AI Interviewer orchestrator API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "groq>=1.7.0",
    "langgraph>=1.2.18",
    "openai>=3.40.0",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "pymupdf>=2.0",
    "python-multipart>=0.0.32",
    "sentry-sdk[fastapi]>=2.73.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear, pyupgrade, simplify, async pitfalls
select = ["F", "E", "W", "I", "B", "UP", "SIM", "ASYNC"]
ignore = [
    "B008",  # FastAPI's Depends() in argument defaults is the intended pattern
    "E501",  # `ruff format` owns code line length; what remains is prompt text and test data
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "bench"]
